name: iPhone test build
on:
  push:
    paths: ['ios/**', '.github/workflows/ios-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build iPhone app without signing credentials
        run: bash ios/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: h1pNoise-iPhone-test
          path: ios-output/h1pNoise-iPhone-unsigned.ipa
          retention-days: 7

